    const DEFAULT_WHAT_IF = {

    function calculateAvailability(batteryRuntimeHours, batteryChargeMinutes) {
      const chargeHours = batteryChargeMinutes / 60;
      if (batteryRuntimeHours + chargeHours <= 0) return 0.8;
      return batteryRuntimeHours / (batteryRuntimeHours + chargeHours);
    }

    function ForgedValue({ value, prefix = '', suffix = '', isCurrency = false }) {
      const [displayValue, setDisplayValue] = useState(value);
      const [isForging, setIsForging] = useState(false);
      const prevValueRef = useRef(value);

      useEffect(() => {
        if (prevValueRef.current !== value) {
          prevValueRef.current = value;
          setDisplayValue(value);
          setIsForging(true);
          const t = setTimeout(() => setIsForging(false), 1100);
          return () => clearTimeout(t);
        }
      }, [value]);

      const formatted = useMemo(() => {
        if (isCurrency) {
          return new Intl.NumberFormat('ru-RU', {
            style: 'currency',
            currency: 'RUB',
            maximumFractionDigits: 0,
          }).format(displayValue);
        }
        return displayValue;
      }, [displayValue, isCurrency]);

      return (
        <span className={`font-mono font-bold transition-all duration-200 ${isForging ? 'forging-glow' : ''}`}>
          {prefix}{formatted}{suffix}
        </span>
      );
    }

    function evaluateRobots(facility, robots) {
      return robots.map((robot) => {
        const reasons = [];

        if (facility.industry !== 'custom' && !robot.supportedIndustries.includes(facility.industry)) {
          reasons.push(`Отраслевое несоответствие: объект [${facility.industry}] не сертифицирован моделью`);
        }

        const aisleMm = facility.aisleWidthM * 1000;
        if (aisleMm < robot.minAisleWidthMm) {
          reasons.push(`Ширина проезда (${facility.aisleWidthM} м) меньше лимита робота (${robot.minAisleWidthMm} мм)`);
        }

        if (facility.requiredPayloadKg > robot.payloadKg) {
          reasons.push(`Требуемая нагрузка ${facility.requiredPayloadKg} кг превышает предел ${robot.payloadKg} кг`);
        }

        const tMin = facility.operatingTempRange.min;
        const tMax = facility.operatingTempRange.max;
        if (tMin < robot.operatingTempRange.min || tMax > robot.operatingTempRange.max) {
          reasons.push(`Температура [${tMin}..${tMax}°C] выходит за паспортный диапазон [${robot.operatingTempRange.min}..${robot.operatingTempRange.max}°C]`);
        }

        return {
          robot,
          isEligible: reasons.length === 0,
          exclusionReasons: reasons,
        };
      }).sort((a, b) => {
        if (a.isEligible && !b.isEligible) return -1;
        if (!a.isEligible && b.isEligible) return 1;
        return a.robot.capexCostRub - b.robot.capexCostRub;
      });
    }

    function calculateEconomics(facility, robot, whatIf) {
      const effThroughput = facility.targetThroughputPerHour * (whatIf.throughputScalePercent / 100);
      const effSalary = facility.averageWorkerSalaryRub * (1 + whatIf.salaryChangePercent / 100);
      const discountFactor = Math.max(0, 1 - (whatIf.capexDiscountPercent / 100));

      const kAvail = calculateAvailability(robot.batteryRuntimeHours, robot.batteryChargeMinutes);
      const unitProd = robot.throughputPerHour * kAvail;
      const fleetSize = Math.max(1, Math.ceil(effThroughput / unitProd));

      // As-Is: 12 units/h manual worker norm rate
      const staffPerShift = Math.max(1, Math.ceil(effThroughput / 12));
      const totalStaff = staffPerShift * facility.shiftsPerDay;
      const annualManualOpex = totalStaff * (effSalary * 1.30) * 12; // 30% taxes
      const fiveYearManualTco = annualManualOpex * 5;

      // Scenario 2: CAPEX (+15% integration buffer)
      const unitCapex = robot.capexCostRub * 1.15 * discountFactor;
      const totalCapex = fleetSize * unitCapex;
      const annualRobotOpex = fleetSize * robot.annualOpexCostRub;
      const fiveYearCapexTco = totalCapex + (annualRobotOpex * 5);
      const annualSavingsCapex = annualManualOpex - annualRobotOpex;
      const simplePaybackYears = annualSavingsCapex > 0 ? totalCapex / annualSavingsCapex : 99;
      const fiveYearRoi = totalCapex > 0 ? (((annualSavingsCapex * 5) - totalCapex) / totalCapex) * 100 : 0;

      // Scenario 3: RaaS (Subscription)
      const annualRaasOpex = fleetSize * robot.monthlyRaasCostRub * 12;
      const fiveYearRaasTco = annualRaasOpex * 5;
      const annualSavingsRaas = annualManualOpex - annualRaasOpex;

      let verdict = 'FEASIBLE';
      let verdictText = 'Инвестиционно привлекательно (окупаемость < 3 лет)';
      if (simplePaybackYears > 5 || annualSavingsCapex <= 0) {
        verdict = 'UNFEASIBLE';
        verdictText = 'Нецелесообразно: ручной труд выгоднее или объем недостаточен';
      } else if (simplePaybackYears > 3) {
        verdict = 'MODERATE';
        verdictText = 'Умеренный срок (3–5 лет). Рекомендуется сценарий RaaS-подписки';
      }

      return {
        fleetSize,
        kAvail: Number(kAvail.toFixed(2)),
        effThroughput: Math.round(effThroughput),
        manual: { staffCount: totalStaff, annualOpex: annualManualOpex, fiveYearTco: fiveYearManualTco },
        capex: {
          totalCapex,
          annualOpex: annualRobotOpex,
          fiveYearTco: fiveYearCapexTco,
          annualSavings: annualSavingsCapex,
          paybackYears: Number(simplePaybackYears.toFixed(1)),
          roi: Number(fiveYearRoi.toFixed(1)),
          verdict,
          verdictText,
        },
        raas: {
          totalCapex: 0,
          annualOpex: annualRaasOpex,
          fiveYearTco: fiveYearRaasTco,
          annualSavings: annualSavingsRaas,
        }
      };
    }

      // Financial model
      const economics = useMemo(() => {

      // Manual counts

          [robotId]: Math.max(0, (prev[robotId] || 0) + delta)
        }));

      const manualTotalFleet = useMemo(() => {
        return Object.values(manualCounts).reduce((s, c) => s + c, 0);
      }, [manualCounts]);

      setIsComputing(true);

          <div className="flex items-center gap-3">
            <div className="w-8 h-8 bg-[#D4AF37] text-[#1A1A1A] font-extrabold flex items-center justify-center border border-[#BFA02E] text-xs tracking-tighter">
              REO
            </div>
            <div>
              <div className="flex items-center gap-2">
                <h1 className="font-semibold text-xs uppercase tracking-tight text-[#1A1A1A]">
                  REO Platform
                </h1>
                <span className="text-[10px] font-mono px-1.5 py-0.2 bg-[#D4AF37]/15 text-[#8A6826] border border-[#D4AF37]/40 uppercase font-semibold">

                        <span className="font-bold text-emerald-700"><ForgedValue value={economics.capex.annualSavings} isCurrency prefix="+" /></span>
                      </div>
                      <div className="p-2.5 grid grid-cols-3 gap-2 items-center bg-[#D4AF37]/10">
                        <span className="text-[#1A1A1A] font-bold text-[11px]">Окупаемость</span>
                        <span className="text-milk-400">—</span>
                        <span className="font-bold text-[#8A6826]"><ForgedValue value={economics.capex.paybackYears} suffix=" года" /></span>
                      </div>
                      <div className="p-2.5 grid grid-cols-3 gap-2 items-center">
                        <span className="text-milk-500 text-[11px]">5-летний ROI</span>
                        <span className="text-milk-400">—</span>
                        <span className="font-bold text-emerald-700"><ForgedValue value={economics.capex.roi} suffix="%" /></span>
                      </div>
                      <div className="p-2.5 grid grid-cols-3 gap-2 items-center bg-[#FFFFFF] font-bold">
                        <span className="text-[#1A1A1A] text-[11px]">TCO (5 лет)</span>
                        <span className="text-milk-700"><ForgedValue value={economics.manual.fiveYearTco} isCurrency /></span>
                        <span className="text-[#58111A] font-bold"><ForgedValue value={economics.capex.fiveYearTco} isCurrency /></span>
                      </div>
                    </div>
                  </div>

                  {/* RaaS Scenario Card */}
                  <div className="p-3 card-clean">
                    <div className="flex items-center justify-between mb-1">
                      <span className="font-semibold text-[11px] uppercase tracking-wider text-[#8A6826]">
                        Сценарий 3: Подписка (RaaS)
                      </span>
                      <span className="text-[10px] font-mono bg-[#D4AF37]/20 text-[#8A6826] px-1 font-bold">0 ₽ CAPEX</span>
                    </div>
                    <p className="text-[11px] text-milk-700 mb-2">
                      Аренда без капитальных затрат. Ежегодный платеж: <strong className="font-mono text-[#1A1A1A]"><ForgedValue value={economics.raas.annualOpex} isCurrency /></strong>
                    </p>
                    <div className="font-mono text-xs flex justify-between pt-1 border-t border-[#D4AF37]/20">
                      <span className="text-milk-500">TCO за 5 лет:</span>
                      <strong className="text-[#8A6826]"><ForgedValue value={economics.raas.fiveYearTco} isCurrency /></strong>
                    </div>
                  </div>
                </div>
              )}

              {rightTab === 'whatif' && (
                <div className="space-y-3.5">
                  <div className="p-3 card-clean">
                    <h4 className="font-semibold text-[11px] uppercase tracking-wider text-[#8A6826] mb-1">
                      Анализ чувствительности (What-If)
                    </h4>
                    <p className="text-[11px] text-milk-500 mb-4">
                      Динамический пересчет TCO и окупаемости при колебаниях рыночных условий.
                    </p>

                    <div className="space-y-4">
                      <div>
                        <div className="flex justify-between font-mono text-[11px] mb-1">
                          <span className="text-milk-700">Индексация зарплат персонала:</span>
                          <strong className="text-[#8A6826]">{whatIf.salaryChangePercent > 0 ? `+${whatIf.salaryChangePercent}%` : `${whatIf.salaryChangePercent}%`}</strong>
                        </div>
                        <input
                          type="range"
                          min="-30"
                          max="50"
                          step="5"
                          value={whatIf.salaryChangePercent}
                          onChange={(e) => setWhatIf({ ...whatIf, salaryChangePercent: Number(e.target.value) })}
                          className="w-full accent-[#D4AF37] cursor-pointer"
                        />
                      </div>

                      <div>
                        <div className="flex justify-between font-mono text-[11px] mb-1">
                          <span className="text-milk-700">Масштабирование грузопотока:</span>
                          <strong className="text-[#8A6826]">{whatIf.throughputScalePercent}%</strong>
                        </div>
                        <input
                          type="range"
                          min="50"
                          max="200"
                          step="10"
                          value={whatIf.throughputScalePercent}
                          onChange={(e) => setWhatIf({ ...whatIf, throughputScalePercent: Number(e.target.value) })}
                          className="w-full accent-[#D4AF37] cursor-pointer"
                        />
                      </div>

                      <div>
                        <div className="flex justify-between font-mono text-[11px] mb-1">
                          <span className="text-milk-700">Субсидия / Скидка на технику:</span>
                          <strong className="text-[#8A6826]">{whatIf.capexDiscountPercent}%</strong>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="30"
                          step="2"
                          value={whatIf.capexDiscountPercent}
                          onChange={(e) => setWhatIf({ ...whatIf, capexDiscountPercent: Number(e.target.value) })}
                          className="w-full accent-[#D4AF37] cursor-pointer"
                        />
                      </div>
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={() => setIsFormulaModalOpen(true)}
                    className="w-full py-2 bg-[#FFFFFF] border border-[#D4AF37]/40 hover:bg-[#F4F4F0] font-mono text-xs text-[#8A6826] cursor-pointer font-bold"
                  >
                    Показать формулы расчета (XAI)
                  </button>
                </div>
              )}

              {rightTab === 'catalog' && (
                <div className="space-y-3">
                  <h4 className="font-semibold text-[11px] uppercase tracking-wider text-[#8A6826]">
                    Объяснимый подбор решений REO (XAI)
                  </h4>
                  
                  <div className="space-y-2">
                    {evaluatedList.map(({ robot, isEligible, exclusionReasons }) => (
                      <div
                        key={robot.id}
                        className={`p-2.5 border text-xs card-clean ${
                          !isEligible ? 'bg-rose-50/50 border-rose-300' : ''
                        }`}
                      >
                        <div className="flex items-center justify-between mb-1">
                          <span className="font-bold text-[#1A1A1A]">{robot.vendor} {robot.model}</span>
                          <span className={`text-[10px] font-mono px-1 font-bold ${
                            isEligible ? 'bg-emerald-100 text-emerald-800 border border-emerald-400' : 'bg-rose-100 text-rose-800 border border-rose-400'
                          }`}>
                            {isEligible ? 'Рекомендован' : 'Отклонен'}
                          </span>
                        </div>
                        
                        <div className="text-[11px] text-milk-500">
                          Нагрузка: {robot.payloadKg} кг • Мин. проезд: {robot.minAisleWidthMm} мм
                        </div>

                        {!isEligible && (
                          <ul className="mt-1.5 space-y-0.5 text-[10px] text-rose-700 border-t border-rose-200 pt-1">
                            {exclusionReasons.map((r, i) => (
                              <li key={i}>• {r}</li>
                            ))}
                          </ul>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </aside>
        </div>

        {/* Formula Assumptions Modal */}
        {isFormulaModalOpen && (
          <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
            <div className="bg-[#FFFFFF] border-2 border-[#D4AF37] max-w-lg w-full p-6 shadow-xl relative">
              <div className="flex justify-between items-center mb-4 border-b border-[#D4AF37]/30 pb-2">
                <h3 className="font-semibold text-sm uppercase text-[#1A1A1A]">
                  Математические формулы и допущения REO (п. 3.5.8 ТЗ)
                </h3>
                <button
                  onClick={() => setIsFormulaModalOpen(false)}
                  className="text-milk-500 hover:text-[#1A1A1A] font-mono font-bold text-sm cursor-pointer"
                >
                  [✕]
                </button>
              </div>

              <div className="space-y-3 font-mono text-xs text-milk-700 leading-relaxed">
                <div>
                  <strong className="text-[#1A1A1A]">1. Доступность АКБ (k_avail):</strong><br />
                  <code>k_avail = T_work / (T_work + T_charge)</code>
                </div>
                <div>
                  <strong className="text-[#1A1A1A]">2. Потребный флот REO:</strong><br />
                  <code>N_fleet = ⌈ Q_target / (Q_robot × k_avail) ⌉</code>
                </div>
                <div>
                  <strong className="text-[#1A1A1A]">3. Простой срок окупаемости:</strong><br />
                  <code>Payback = CAPEX / (OPEX_manual - OPEX_robots)</code>
                </div>
                <div>
                  <strong className="text-[#1A1A1A]">4. 5-летний TCO:</strong><br />
                  <code>TCO_5 = CAPEX + (5 × OPEX_annual)</code>
                </div>
              </div>

              <div className="mt-6 flex justify-end">
                <button
                  onClick={() => setIsFormulaModalOpen(false)}
                  className="px-4 py-1.5 bg-[#D4AF37] hover:bg-[#BFA02E] text-[#1A1A1A] font-bold text-xs uppercase cursor-pointer"
                >
                  Понятно
                </button>
              </div>
            </div>
          </div>
        )}

        {/* Toast Notification */}
        {toastNotice && (
          <div className="fixed bottom-4 right-4 z-50 bg-[#FFFFFF] text-[#1A1A1A] border-2 border-[#D4AF37] px-4 py-2.5 text-xs font-mono shadow-lg flex items-center gap-2">
            <span className="w-2 h-2 bg-[#D4AF37]"></span>
            <span className="font-bold">{toastNotice}</span>
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
